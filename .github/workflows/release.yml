name: Release

# Compila las dos apps y publica sus APK en Lanzamientos (Releases):
#   YouTube-M.apk  -> celular (com.ottmty.tubemobile)
#   YoTuve-Tv.apk  -> TV      (com.ottmty.tubetv)
# En main se publica; en otras ramas solo se compila y se guardan los APK como artefactos.

on:
  push:
    branches: [main, tube-ottmty]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 21.0.6113669
      CMDLINE_TOOLS_VERSION: "23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: NDK y profgen
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmdline-tools;$CMDLINE_TOOLS_VERSION" > /dev/null
          profgen="$ANDROID_HOME/cmdline-tools/$CMDLINE_TOOLS_VERSION/bin/profgen"
          test -x "$profgen"
          echo "PROFGEN=$profgen" >> "$GITHUB_ENV"
      - name: Firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/signing.sh mobile
      - name: Compilar
        working-directory: mobile
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileRelease -PprofgenPath="$PROFGEN"
      - name: Preparar APK
        run: cp mobile/smarttubetv/build/outputs/renamed_apks/stmobileRelease/YouTube-M_universal.apk YouTube-M.apk
      - name: Revisar APK
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging YouTube-M.apk | grep -E "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:|launchable-activity" | cut -c1-200
          "$bt/aapt2" dump badging YouTube-M.apk | grep -q "package: name='com.ottmty.tubemobile'"
          "$bt/apksigner" verify --print-certs YouTube-M.apk | head -3
          ls -la YouTube-M.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-M
          path: YouTube-M.apk

  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 21.0.6113669
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: NDK
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/signing.sh tv
      - name: Compilar
        working-directory: tv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleStfdroidRelease
      - name: Preparar APK
        run: cp tv/smarttubetv/build/outputs/apk/stfdroid/release/YoTuve-Tv_universal.apk YoTuve-Tv.apk
      - name: Revisar APK
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging YoTuve-Tv.apk | grep -E "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:|launchable-activity" | cut -c1-200
          "$bt/aapt2" dump badging YoTuve-Tv.apk | grep -q "package: name='com.ottmty.tubetv'"
          "$bt/apksigner" verify --print-certs YoTuve-Tv.apk | head -3
          ls -la YoTuve-Tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YoTuve-Tv
          path: YoTuve-Tv.apk

  publish:
    needs: [mobile, tv]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" dist/YouTube-M.apk dist/YoTuve-Tv.apk \
            --repo "${{ github.repository }}" \
            --title "Tube OTTMTY v${{ github.run_number }}" \
            --notes "Última versión: YouTube-M.apk (celular) y YoTuve-Tv.apk (TV)." \
            --latest
